# Build and run the honesty checks on every pull request, without deploying.
name: CI

on:
  pull_request:
    branches: [main]

env:
  BASE_PATH: /tibyaan-site
  SITE_URL: https://tibyaan-org.github.io/tibyaan-site

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Honesty checks
        run: node scripts/honesty-checks.mjs
